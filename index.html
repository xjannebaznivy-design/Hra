<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terminal Game - Escape the City</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', 'Courier', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        h1 {
            margin-top: 20px;
            text-shadow: 0 0 10px #00ff00;
            font-size: 2em;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .buttons {
            margin: 20px;
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 30px;
            background: #111;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Terminal Container */
        .terminal {
            width: 90vw;
            max-width: 1000px;
            height: 500px;
            background: #000;
            border: 2px solid #00ff00;
            border-radius: 3px;
            box-shadow: 0 0 20px #00ff00, inset 0 0 20px rgba(0, 255, 0, 0.05);
            display: none;
            flex-direction: column;
            padding: 15px;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }

        .terminal.active {
            display: flex;
        }

        /* Scanlines Effect */
        .terminal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
            border-radius: 3px;
        }

        .terminal-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 13px;
            line-height: 1.6;
            position: relative;
            z-index: 0;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .terminal-content::-webkit-scrollbar {
            width: 10px;
        }

        .terminal-content::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .terminal-content::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 5px;
        }

        .terminal-input {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            position: relative;
            z-index: 0;
            font-size: 13px;
        }

        .terminal-prompt {
            color: #00ff00;
            font-weight: bold;
            white-space: nowrap;
        }

        #terminalInput {
            flex: 1;
            background: transparent;
            color: #00ff00;
            border: none;
            outline: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 0;
            margin: 0;
        }

        #terminalInput::placeholder {
            color: #005500;
        }

        /* Blikající kurzor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #00ff00;
            margin-left: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .line {
            margin: 3px 0;
            animation: fadeIn 0.3s;
        }

        .command-line {
            color: #00ff00;
            margin-bottom: 5px;
        }

        .output-line {
            color: #00ff00;
            margin-bottom: 3px;
        }

        .error-line {
            color: #ff0000;
            margin-bottom: 3px;
        }

        .success-line {
            color: #00ff00;
            margin-bottom: 3px;
        }

        .question-line {
            color: #00ffff;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .timer-line {
            color: #ff6600;
            margin-bottom: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .start-screen {
            text-align: center;
            max-width: 700px;
        }

        .start-screen p {
            font-size: 14px;
            color: #00ffff;
            margin: 15px 0;
            text-shadow: 0 0 5px #00ffff;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
        }

        .start-screen strong {
            color: #ffff00;
        }

        .game-over-screen {
            text-align: center;
        }

        .game-over-screen h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #ffff00;
        }

        .restart-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>>> TERMINAL GAME</h1>

    <div class="buttons">
        <button onclick="startGame()">▶️ START</button>
        <button onclick="exitGame()">⏹️ EXIT</button>
    </div>

    <div id="startScreen" class="start-screen" style="margin: 40px;">
        <p>>> INICIACE HRY</p>
        <p>🔒 <strong>Tvůj úkol je se dostat z města...</strong></p>
        <p>Aby jsi se mohl dostat z města budeš muset odpovědět pár otázek.</p>
        <p>Máš pouze <strong>500 sekund</strong> a <strong>1 život</strong>!</p>
        <p>Každá chybná odpověď tě může stát život...</p>
        <p style="color: #ff00ff; margin-top: 30px;">Klikni na <strong>START</strong> když si připraven!</p>
    </div>

    <div id="terminal" class="terminal">
        <div class="terminal-content" id="terminalContent"></div>
        <div class="terminal-input">
            <span class="terminal-prompt">></span>
            <input 
                type="text" 
                id="terminalInput" 
                placeholder="answer"
                onkeypress="if(event.key === 'Enter') submitTerminalAnswer()"
            />
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("terminal").classList.add("active");
            
            currentIndex = 0;
            lives = 1;
            startTime = Date.now();
            
            displayTerminalQuestion();
        }

        function exitGame() {
            location.reload();
        }
    </script>

    <script src="game.js"></script>

</body>

</html>
