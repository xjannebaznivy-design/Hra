<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terminal Game - Escape the City</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;

            overflow-x: hidden;
        }

        h1 {
            margin-top: 20px;
            text-shadow: 0 0 10px #00ff00;
            font-size: 3em;
            letter-spacing: 3px;
        }

        .buttons {
            margin: 30px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 15px 40px;
            margin: 10px;

            background: #111;
            color: #00ff00;

            border: 2px solid #00ff00;
            border-radius: 5px;

            cursor: pointer;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            font-weight: bold;

            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #gameContainer {
            width: 90vw;
            max-width: 900px;
            min-height: 500px;

            border: 3px solid #00ff00;
            border-radius: 5px;

            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #0a0a0a;
            box-shadow: 0 0 20px #00ff00, inset 0 0 20px rgba(0, 255, 0, 0.05);

            padding: 30px;
            margin: 20px;
            position: relative;
        }

        #gameContainer.active {
            display: flex;
        }

        .game-content {
            width: 100%;
            text-align: center;
        }

        .timer {
            font-size: 1.5em;
            color: #ff0000;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #ff0000;
            font-weight: bold;
        }

        .lives {
            font-size: 1.5em;
            color: #ff6600;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #ff6600;
            font-weight: bold;
        }

        .question-number {
            font-size: 1.2em;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #00ffff;
        }

        .question-box {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            margin: 20px 0;
        }

        .question-box h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .choices-label {
            color: #00ffff;
            font-size: 1.1em;
            margin-bottom: 20px;
            font-style: italic;
        }

        #answerInput {
            width: 100%;
            padding: 15px;
            margin: 15px 0;

            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 5px;

            font-family: 'Courier New', monospace;
            font-size: 1.1em;

            transition: 0.3s;
        }

        #answerInput:focus {
            outline: none;
            box-shadow: 0 0 15px #00ff00;
            border-color: #00ff00;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;

            background: #111;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 5px;

            cursor: pointer;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            font-weight: bold;

            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        .hack-message {
            margin-top: 20px;
            padding: 15px;
            background: #001a00;
            border-left: 4px solid #00ff00;
            border-radius: 5px;
            font-style: italic;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        .result-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            font-size: 1.3em;
            font-weight: bold;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .correct-answer {
            background: #001a00;
            border: 2px solid #00ff00;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .wrong-answer {
            background: #1a0000;
            border: 2px solid #ff0000;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        .game-over {
            text-align: center;
            width: 100%;
        }

        .game-over h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .restart-btn {
            width: auto;
            padding: 20px 60px;
            font-size: 1.5em;
        }

        .start-screen {
            text-align: center;
        }

        .start-screen p {
            font-size: 1.2em;
            color: #00ffff;
            margin: 20px 0;
            text-shadow: 0 0 5px #00ffff;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Scanlines efekt pro vyšší autentičnost terminálu */
        #gameContainer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>> TERMINAL GAME</h1>

    <div class="buttons">
        <button onclick="startGame()">▶️ START</button>
        <button onclick="exitGame()">⏹️ EXIT</button>
    </div>

    <div id="gameContainer">
        <!-- Hra se načítá zde -->
    </div>

    <div id="startScreen" class="start-screen" style="margin: 40px;">
        <p>> INICIACE HRY</p>
        <p>🔒 <strong>Tvůj úkol je se dostat z města...</strong></p>
        <p>Aby jsi se mohl dostat z města budeš muset odpovědět pár otázek.</p>
        <p>Máš pouze <strong>500 sekund</strong> a <strong>1 život</strong>!</p>
        <p>Každá chybná odpověď tě může stát život...</p>
        <p style="color: #ff00ff; margin-top: 30px;">Klikni na <strong>START</strong> když si připraven!</p>
    </div>

    <script>
        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            const gameContainer = document.getElementById("gameContainer");
            gameContainer.classList.add("active");
            
            // Resetuj hru
            currentIndex = 0;
            lives = 1;
            startTime = Date.now();
            
            displayQuestion();
        }

        function exitGame() {
            location.reload();
        }
    </script>

    <script src="game.js"></script>

</body>

</html>
