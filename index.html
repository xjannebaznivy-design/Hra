<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Moje Hra</title>

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin-top:20px;
}

.buttons{
    margin:20px;
}

button{
    padding:10px 20px;
    margin:10px;
    background:#222;
    color:white;
    border:1px solid #555;
    cursor:pointer;
    font-size:18px;
}

iframe{
    width:90vw;
    height:80vh;
    border:none;
    display:none;
}
</style>
</head>

<body>

<h1>TERMINAL GAME</h1>

<div class="buttons">
    <button onclick="startGame()">START</button>
    <button onclick="closeGame()">EXIT</button>
</div>

<iframe
    id="gameFrame"
    src="https://onlinegdb.com/embed/aJ0MYo5Lp?theme=dark">
</iframe>

<script>
function startGame(){
    document.getElementById("gameFrame").style.display = "block";
}

function closeGame(){
    document.getElementById("gameFrame").style.display = "none";
}
</script>

</body>
</html>
